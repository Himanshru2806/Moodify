services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moodify
      POSTGRES_USER: moodify
      POSTGRES_PASSWORD: moodify
    ports:
      - "${MOODIFY_DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
